name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack OmniEdit project ZIP
        run: unzip -o OmniEdit-AI-Android-Ready.zip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: omni-edit-android
        run: npm install
      - name: Build web app
        working-directory: omni-edit-android
        run: npm run build
      - name: Add Android platform
        working-directory: omni-edit-android
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: omni-edit-android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: omni-edit-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniEdit-AI-debug-apk
          path: omni-edit-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
